name: '[DEV] Build and Deploy Frontend'

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'staticwebapp.config.json'
      - '.github/workflows/frontend.yml'
      - '.github/workflows/_frontend-deploy.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # Frontend Checks
  # ============================================
  frontend-lint:
    name: 'Frontend: Lint'
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # pnpm/action-setup is not available on this instance; the version comes from packageManager in package.json
      - name: Install pnpm
        run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  frontend-typecheck:
    name: 'Frontend: TypeCheck'
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # pnpm/action-setup is not available on this instance; the version comes from packageManager in package.json
      - name: Install pnpm
        run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript check
        run: pnpm typecheck

  frontend-test:
    name: 'Frontend: Test'
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # pnpm/action-setup is not available on this instance; the version comes from packageManager in package.json
      - name: Install pnpm
        run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  # ============================================
  # Security Checks
  # ============================================
  security-scan:
    name: 'Security: Dependency Audit'
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # pnpm/action-setup is not available on this instance; the version comes from packageManager in package.json
      - name: Install pnpm
        run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - name: Run pnpm audit
        run: pnpm audit --audit-level moderate || true
        continue-on-error: true

  # ============================================
  # Format Check
  # ============================================
  format-check:
    name: 'Format: Prettier'
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # pnpm/action-setup is not available on this instance; the version comes from packageManager in package.json
      - name: Install pnpm
        run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  # ============================================
  # Commit Message Check
  # ============================================
  commitlint:
    name: 'Commit: Message Lint'
    runs-on: ubuntu-latest
    environment: development
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # pnpm/action-setup is not available on this instance; the version comes from packageManager in package.json
      - name: Install pnpm
        run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # ============================================
  # Deploy
  # ============================================
  deploy:
    name: Build & Deploy Job
    permissions:
      contents: read
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    needs:
      [
        frontend-lint,
        frontend-typecheck,
        format-check,
        security-scan,
        frontend-test,
      ]
    uses: ./.github/workflows/_frontend-deploy.yml
    with:
      environment: development
    secrets: inherit
